name: APieceOfWhole
options:
  bundleIdPrefix: com.traddifftech
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  APieceOfWhole:
    type: application
    platform: iOS
    sources:
      - path: APieceOfWhole
        excludes:
          - "Config/Secrets.xcconfig"
    info:
      path: APieceOfWhole/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Here
        CFBundleIdentifier: com.traddifftech.apieceofwhole
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSMicrophoneUsageDescription: "Used for audio practices"
        NSPhotoLibraryUsageDescription: "Used to upload profile photos"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.traddifftech.apieceofwhole
        DEVELOPMENT_TEAM: SP854VZ979
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: APieceOfWhole/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          DEBUG_INFORMATION_FORMAT: dwarf
          XCCONFIG_FILE: APieceOfWhole/Config/Secrets.xcconfig
        Release:
          XCCONFIG_FILE: APieceOfWhole/Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: APieceOfWhole/APieceOfWhole.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.traddifftech.apieceofwhole"
